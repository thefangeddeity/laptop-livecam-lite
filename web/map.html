<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lightcv map</title>
<style>
  :root { --bg:#12141a; --panel:#1b1f27; --ink:#c9d1de; --dim:#7c8798;
          --line:#39414f; --accent:#f0b04a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 ui-sans-serif,system-ui,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  .grow { flex:1; }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--line);
           padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { border-color:var(--accent); color:var(--accent); }
  main { display:flex; gap:16px; padding:16px; align-items:flex-start;
         flex-wrap:wrap; }
  .pane { background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:12px; }
  canvas { display:block; background:#0d0f13; border-radius:6px;
           cursor:crosshair; max-width:100%; }
  #map { image-rendering:auto; border-radius:6px; max-width:100%; }
  table { border-collapse:collapse; font-size:12.5px; }
  td,th { padding:3px 8px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  .hint { color:var(--dim); font-size:12.5px; margin:8px 0 0; max-width:520px; }
  input[type=text],input[type=number] { background:#0d0f13; color:var(--ink);
      border:1px solid var(--line); border-radius:5px; padding:4px 7px;
      font:inherit; width:110px; }
</style>
</head>
<body>
<header>
  <h1>lightcv &mdash; map</h1>
  <button id="mode-view" class="on">View</button>
  <button id="mode-trace">Trace floor</button>
  <button id="mode-drag">Drag corners</button>
  <span class="grow"></span>
  <span id="status" style="color:var(--dim)"></span>
  <button id="save">Save map</button>
</header>

<main>
  <div class="pane">
    <div style="margin-bottom:8px;color:var(--dim);font-size:12.5px">
      Camera view &mdash; trace the floor, drag to correct
    </div>
    <canvas id="cam" width="880" height="495"></canvas>
    <p class="hint" id="hint">
      <b>Trace floor:</b> click the four corners of the floor, in order
      near-left, near-right, far-right, far-left. <b>Drag corners:</b> grab a
      point to move it. Then set the real-world size below and save.
    </p>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label>width cm <input type="number" id="w-cm" value="300" step="10"></label>
      <label>depth cm <input type="number" id="d-cm" value="250" step="10"></label>
      <label>camera height cm <input type="number" id="cam-h" value="75" step="5"></label>
      <button id="clear">Clear trace</button>
    </div>
  </div>

  <div class="pane">
    <div style="margin-bottom:8px;color:var(--dim);font-size:12.5px">
      World &mdash; rendered on change (rev <span id="rev">?</span>)
    </div>
    <img id="map" width="500" alt="map">
    <table id="sectors" style="margin-top:10px"></table>
  </div>
</main>

<script>
// The map is state. This page polls the REVISION, not the image: if nothing
// wrote to the world there is nothing to redraw, which is the whole point of
// the inversion. A dead feed leaves the last map on screen, unchanged.
let mode = 'view', trace = [], drag = -1, lastRev = -1, world = null;
const cam = document.getElementById('cam'), ctx = cam.getContext('2d');
const backdrop = new Image();
backdrop.onload = draw;
backdrop.src = '/api/backdrop.png?' + Date.now();

function setMode(m) {
  mode = m;
  for (const id of ['view','trace','drag']) {
    document.getElementById('mode-'+id).classList.toggle('on', id===m);
  }
}
document.getElementById('mode-view').onclick  = () => setMode('view');
document.getElementById('mode-trace').onclick = () => { setMode('trace'); trace=[]; draw(); };
document.getElementById('mode-drag').onclick  = () => setMode('drag');
document.getElementById('clear').onclick = () => { trace=[]; draw(); };

function draw() {
  ctx.clearRect(0,0,cam.width,cam.height);
  if (backdrop.complete && backdrop.naturalWidth) {
    ctx.drawImage(backdrop, 0, 0, cam.width, cam.height);
  } else {
    ctx.fillStyle = '#0d0f13'; ctx.fillRect(0,0,cam.width,cam.height);
  }
  if (trace.length) {
    ctx.strokeStyle = '#f0b04a'; ctx.lineWidth = 2;
    ctx.beginPath();
    trace.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
    if (trace.length === 4) ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = 'rgba(240,176,74,.16)';
    if (trace.length === 4) ctx.fill();
    trace.forEach((p,i) => {
      ctx.fillStyle = '#f0b04a';
      ctx.beginPath(); ctx.arc(p[0],p[1],6,0,7); ctx.fill();
      ctx.fillStyle = '#12141a'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText(String(i), p[0]-3, p[1]+4);
    });
  }
}

function at(e) {
  const r = cam.getBoundingClientRect();
  return [(e.clientX-r.left) * cam.width / r.width,
          (e.clientY-r.top)  * cam.height / r.height];
}
cam.addEventListener('mousedown', e => {
  const p = at(e);
  if (mode === 'trace' && trace.length < 4) { trace.push(p); draw(); }
  else if (mode === 'drag') {
    let best=-1, bd=18;
    trace.forEach((q,i) => { const d=Math.hypot(q[0]-p[0],q[1]-p[1]);
                             if (d<bd) { bd=d; best=i; } });
    drag = best;
  }
});
cam.addEventListener('mousemove', e => {
  if (drag >= 0) { trace[drag] = at(e); draw(); }
});
window.addEventListener('mouseup', () => { drag = -1; });

async function poll() {
  try {
    const r = await (await fetch('/api/revision')).json();
    if (r.revision !== lastRev) {
      lastRev = r.revision;
      document.getElementById('rev').textContent = r.revision;
      document.getElementById('map').src = '/api/map.png?r=' + r.revision;
      world = await (await fetch('/api/world')).json();
      renderTable();
    }
  } catch (e) { /* feed down: keep showing the last known world */ }
}

function renderTable() {
  if (!world) return;
  const rows = ['<tr><th>sector</th><th>height</th><th>source</th></tr>'];
  for (const s of world.sectors) {
    rows.push(`<tr><td>${s.label}</td><td>${s.floor_height.toFixed(0)} cm</td>`+
              `<td style="color:${s.source==='confirmed'?'#8fce8f':'#c9a04a'}">`+
              `${s.source}</td></tr>`);
  }
  for (const t of world.things) {
    const on = world.sectors.find(s => s.sector_id === t.sector_id);
    rows.push(`<tr><td style="color:#f0b04a">${t.label||t.kind}</td>`+
              `<td colspan="2">on ${on?on.label:'—'} `+
              `(${t.x.toFixed(0)}, ${t.y.toFixed(0)})</td></tr>`);
  }
  document.getElementById('sectors').innerHTML = rows.join('');
}

document.getElementById('save').onclick = async () => {
  const st = document.getElementById('status');
  if (trace.length !== 4) { st.textContent = 'trace 4 floor corners first'; return; }
  const W = +document.getElementById('w-cm').value;
  const D = +document.getElementById('d-cm').value;
  // near-left, near-right, far-right, far-left  ->  map cm
  const mapPts = [[0,0],[W,0],[W,D],[0,D]];
  const sectors = (world ? world.sectors.filter(s => s.label !== 'floor') : []);
  sectors.unshift({label:'floor', floor_height:0, polygon:mapPts,
                   source:'confirmed', confidence:1.0, locked:true});
  const res = await fetch('/api/world', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sectors,
        image_quad: trace, map_quad: mapPts,
        camera_height_cm: +document.getElementById('cam-h').value})});
  const j = await res.json();
  st.textContent = j.ok ? `saved rev ${j.revision}` : ('error: ' + (j.error||'?'));
  lastRev = -1;
};

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
